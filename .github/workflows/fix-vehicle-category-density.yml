name: Repair desktop category density

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-vehicle-category-density.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch category selection
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/home/desktop/DesktopHomeVehicleCategories.svelte')
          text = path.read_text(encoding='utf-8')
          if text.count('showEmptyCategories = false') != 1:
              raise SystemExit('expected one default category visibility setting')
          text = text.replace('showEmptyCategories = false', 'showEmptyCategories = true')
          old = '? allVehicleCategories\n'
          new = '? [...allVehicleCategories].sort((left, right) => Number(right.count > 0) - Number(left.count > 0))\n'
          if text.count(old) != 1:
              raise SystemExit('expected one complete-category branch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'showEmptyCategories = true' src/lib/components/home/desktop/DesktopHomeVehicleCategories.svelte
      - name: Validate template
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Commit validated fix
        run: |
          set -euo pipefail
          rm .github/workflows/fix-vehicle-category-density.yml
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/components/home/desktop/DesktopHomeVehicleCategories.svelte .github/workflows/fix-vehicle-category-density.yml
          git commit -m 'Keep desktop vehicle category grid complete'
          git push origin HEAD:main
